apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelink
  annotations: { nginx.ingress.kubernetes.io/proxy-body-size: 26m }
spec:
  tls: [{ hosts: [app.example.com], secretName: homelink-tls }]
  rules:
    - host: app.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
