apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelink
resources: [namespace.yaml, configmap.yaml, workloads.yaml, ingress.yaml]
images:
  - { name: homelink-api, newName: ghcr.io/example/homelink-api, newTag: latest }
  - { name: homelink-migrate, newName: ghcr.io/example/homelink-migrate, newTag: latest }
  - { name: homelink-web, newName: ghcr.io/example/homelink-web, newTag: latest }
