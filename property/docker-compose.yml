services:
  postgres:
    image: postgres:16
    container_name: homelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_property
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - homelink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_property']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: homelink-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - homelink_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homelink_postgres_data:
  homelink_redis_data:
